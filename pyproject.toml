[project]
name = "clinrag-hypertension"
version = "0.1.0"
description = "Citation-verified clinical Q&A over hypertension guidelines, with measured faithfulness scores."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlos" }]

dependencies = [
    "llama-index-core>=0.12",
    "llama-index-vector-stores-lancedb>=0.3",
    "llama-index-embeddings-huggingface>=0.4",
    "lancedb>=0.13",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "google-genai>=0.3",
    "ragas>=0.2",
    "mlflow>=2.18",
    "streamlit>=1.40",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/carlosemg18/clinrag-hypertension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clinrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
